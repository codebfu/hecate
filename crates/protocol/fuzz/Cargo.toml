[package]
name = "hecate-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.93"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hecate-protocol = { path = ".." }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "fuzz_shell_policy"
path = "fuzz_targets/fuzz_shell_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_agent_signing"
path = "fuzz_targets/fuzz_agent_signing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_backup_encrypted"
path = "fuzz_targets/fuzz_backup_encrypted.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_agent_enroll"
path = "fuzz_targets/fuzz_agent_enroll.rs"
test = false
doc = false
bench = false
