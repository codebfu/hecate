[workspace]
resolver = "2"
members = ["crates/protocol", "crates/api", "crates/cli"]
default-members = ["crates/api"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["Gaultier HUBERT"]

[workspace.dependencies]
hecate-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
