name: Release (Docker)

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/codebfu/hecate
  MCP_IMAGE: ghcr.io/codebfu/hecate-mcp
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  docker:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API+UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          build-args: |
            HECATE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.API_IMAGE }}:${{ env.VERSION }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push MCP image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: mcp-runtime
          push: true
          build-args: |
            HECATE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.MCP_IMAGE }}:${{ env.VERSION }}
            ${{ env.MCP_IMAGE }}:latest
